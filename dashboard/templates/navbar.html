{% load static %}
<div class="navbar bg-base-100 rounded shadow-sm border border-base-300 mx-auto px-4 container sticky top-4 z-50 rounded-xl">
    <div class="flex-1">
        <div class="grid grid-flow-col grid-rows-2 gap-0">
            <div class="row-span-2">
                <a class="btn btn-ghost text-xl" hx-on:click="confetti()"><i class="fa-solid fa-magnifying-glass-chart logo-icon"></i>PACER dashboard</a>
            </div>
        </div>
    </div>
    <div class="flex-2">
        <div class="grid grid-flow-col grid-rows-2 gap-1" style="max-width: 50em">
            <div class="row-span-1 col-span-2">
                <label class="input general-text-search rounded-xl">
                    <i class="fa-solid fa-magnifying-glass"></i>
                    <input type="search" required placeholder="Search" id="general-text-search"/>
                </label>
            </div>
            <div class="row-span-1 col-span-2">
                <form>
                    {% for msg_type in message_types %}
                        <input class="btn btn-sm rounded-xl" type="checkbox" name="msg-filters" aria-label="{{ msg_type }}"/>
                    {% endfor %}
                    <button class="btn btn-sm btn-square rounded-xl" type="reset" aria-label="Clear filters">
                        <i class="fa-solid fa-x"></i>
                    </button>
                </form>
            </div>
        </div>
    </div>
    <div class="flex-none">
        <ul class="menu menu-horizontal px-1">
            <li>
                <div style="margin-right: 0.5em; margin-top: -0.4em;">
                    {% include "theme_toggle.html" %}
                </div>
            </li>
            {% if not DISABLED_AUTH %}
                <li>{% if not user.is_authenticated %}
                    <a href="{% url "sso_login" %}" class="btn btn-outline btn-primary btn-xs rounded-xl">
                        Login
                    </a>
                {% else %}
                    <a href="{% url "sso_logout" %}"
                       class="btn btn-outline btn-error rounded-xl">
                        Logout
                    </a>
                {% endif %}
                </li>
            {% endif %}
        </ul>
    </div>
</div>
