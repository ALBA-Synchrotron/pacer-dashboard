<div class="stat">
    <div class="stat-figure {{ stats.text_class }}">
        <i class="{{ stats.icon }}" style="font-size: 2em"></i>
    </div>
    <div class="stat-title">{{ stats.title }}</div>
    <div class="stat-value {{ stats.text_class }}">{{ stats.value }}</div>
    <div class="stat-desc">{{ stats.subtitle }}</div>
</div>
